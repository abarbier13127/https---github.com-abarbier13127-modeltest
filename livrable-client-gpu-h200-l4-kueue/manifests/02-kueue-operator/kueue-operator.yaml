# Red Hat build of Kueue Operator — canal stable-v1.3 (Kueue v1.3.x), validé avec RHOAI 3.5.1.
# À CONFIRMER dans la matrice de support RHOAI 3.x pour la version RHOAI du client.
# installPlanApproval: Manual → l'InstallPlan doit être approuvé à la main (voir PROCEDURE-DEPLOIEMENT.md, étape 4).
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-kueue-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-kueue-operator
  namespace: openshift-kueue-operator
spec: {}                     # AllNamespaces : seul mode supporté par le package kueue-operator
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: kueue-operator
  namespace: openshift-kueue-operator
spec:
  name: kueue-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  channel: stable-v1.3
  installPlanApproval: Manual
