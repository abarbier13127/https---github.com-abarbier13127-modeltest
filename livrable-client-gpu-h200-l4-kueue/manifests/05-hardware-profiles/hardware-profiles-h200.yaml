# Hardware profiles H200 — type Queue → LocalQueue "default" (créée par RHOAI dans chaque projet géré par Kueue).
# Globaux (namespace redhat-ods-applications) : proposés dans tous les projets gérés par Kueue.
# Ils demandent des RESSOURCES (nvidia.com/gpu, nvidia.com/mig-*) : c'est Kueue qui choisit la flavor, donc le type de nœud.
# Un profil Queue ne doit porter NI nodeSelector NI toleration (règle RHOAI) : le placement vient de la ResourceFlavor.
# Valeurs CPU/mémoire : bornes proposées dans le dashboard, À ADAPTER.
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: h200-full
  namespace: redhat-ods-applications
  annotations:
    opendatahub.io/display-name: "NVIDIA H200 141 Go"
    opendatahub.io/description: "GPU H200 entier (1 à 8), via Kueue."
    opendatahub.io/disabled: "false"
    opendatahub.io/managed: "false"
    opendatahub.io/dashboard-feature-visibility: "[]"
  labels:
    gpu-kueue.livrable/profile: "true"
spec:
  identifiers:
  - {identifier: nvidia.com/gpu, displayName: "NVIDIA H200", resourceType: Accelerator, defaultCount: 1, minCount: 1, maxCount: 8}
  - {identifier: cpu, displayName: CPU, resourceType: CPU, defaultCount: 16, minCount: 1, maxCount: 128}
  - {identifier: memory, displayName: Memory, resourceType: Memory, defaultCount: 128Gi, minCount: 4Gi, maxCount: 1536Gi}
  scheduling:
    type: Queue
    kueue:
      localQueueName: default
---
