# EXEMPLE — ClusterQueue dédiée au projet "equipe-a" (remplacer equipe-a par le nom du projet).
# Quota RÉSERVÉ : sans cohort (non supporté en RHOAI 3.5), pas d'emprunt entre ClusterQueues.
# ⚠ La somme des quotas d'une même flavor sur toutes les ClusterQueues ne doit pas dépasser la capacité réelle
#   des nœuds, sinon Kueue admet des pods que le scheduler ne pourra pas placer (Pending).
#   → baisser d'autant les quotas de la ClusterQueue "default" (04-kueue-queues/clusterqueue-default.yaml).
# namespaceSelector : seul le projet equipe-a peut utiliser cette ClusterQueue.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-equipe-a
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: equipe-a
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources: [cpu, memory, nvidia.com/gpu, nvidia.com/mig-1g.18gb, nvidia.com/mig-2g.35gb, nvidia.com/mig-3g.71gb]
    flavors:
    - name: rf-h200                      # exemple : 8 H200 entiers réservés à equipe-a
      resources:
      - {name: cpu, nominalQuota: 192}
      - {name: memory, nominalQuota: 2048Gi}
      - {name: nvidia.com/gpu, nominalQuota: 8}
      - {name: nvidia.com/mig-1g.18gb, nominalQuota: 0}
      - {name: nvidia.com/mig-2g.35gb, nominalQuota: 0}
      - {name: nvidia.com/mig-3g.71gb, nominalQuota: 0}
    - name: rf-h200-mig                  # exemple : 4 tranches 2g.35gb réservées
      resources:
      - {name: cpu, nominalQuota: 32}
      - {name: memory, nominalQuota: 256Gi}
      - {name: nvidia.com/gpu, nominalQuota: 0}
      - {name: nvidia.com/mig-1g.18gb, nominalQuota: 0}
      - {name: nvidia.com/mig-2g.35gb, nominalQuota: 4}
      - {name: nvidia.com/mig-3g.71gb, nominalQuota: 0}
